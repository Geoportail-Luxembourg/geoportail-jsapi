server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /4.1.0/apidoc/;
    }

    location = /4.1.0 {
        return 302 /4.1.0/apidoc/;
    }

    location = /4.1.0/ {
        return 302 /4.1.0/apidoc/;
    }
    location = /latest {
        return 302 /latest/apidoc/;
    }

    location = /latest/ {
        return 302 /latest/apidoc/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
