<!DOCTYPE html>
<html>
  <head>
    <title>Topology API - Geometry Validation Example</title>
    <meta charset="utf-8">
    <meta name="viewport"
          content="initial-scale=1.0, user-scalable=no, width=device-width">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../../dist/apiv4.css">
    <script src="../../apiv4loader.js"  type="text/javascript"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 10px;
        background: #f5f5f5;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px 0;
      }
      #mapContainer {
        width: 100%;
        height: 500px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
      }
      .info {
        background: white;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .info h2 {
        font-size: 14px;
        margin: 0 0 5px 0;
      }
      #results {
        font-family: monospace;
        font-size: 12px;
        color: #333;
        white-space: pre-wrap;
        max-height: 220px;
        overflow-y: auto;
      }
      .ok { color: #2f855a; font-weight: bold; }
      .warn { color: #c05621; font-weight: bold; }
      .error { color: #c53030; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>Topology API - Geometry Validation</h1>
    <p>Modify the red parcel. If a geometry error appears (for example self-intersection), it is reported below.</p>
    <div id="mapContainer"></div>
    <div class="info">
      <h2>Validation status:</h2>
      <div id="results">Loading parcels…</div>
    </div>
    <script src="topology-data.js" type="text/javascript"></script>
    <script src="validate.js" type="text/javascript"></script>
    <script src="show-source.js" data-source="validate.js" type="text/javascript"></script>
  </body>
</html>
