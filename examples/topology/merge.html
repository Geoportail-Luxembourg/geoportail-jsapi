<!DOCTYPE html>
<html>
  <head>
    <title>Topology API - Merge Features Example</title>
    <meta charset="utf-8">
    <meta name="viewport"
          content="initial-scale=1.0, user-scalable=no, width=device-width">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../../dist/apiv4.css">
    <script src="../../apiv4loader.js"  type="text/javascript"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 10px;
        background: #f5f5f5;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px 0;
      }
      #mapContainer {
        width: 100%;
        height: 500px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
      }
      .controls {
        background: white;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 10px;
      }
      button {
        padding: 8px 16px;
        background: #0066cc;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #0052a3;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .info {
        background: white;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .info h2 {
        font-size: 14px;
        margin: 0 0 5px 0;
      }
      #results {
        font-family: monospace;
        font-size: 12px;
        color: #333;
        white-space: pre-wrap;
        max-height: 150px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h1>Topology API - Merge Features</h1>
    <p>Click on polygons to select them, then click "Merge Selected" to merge them.</p>
    <div id="mapContainer"></div>
    <div class="controls">
      <button id="mergeBtn" disabled>Merge Selected Features</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="info">
      <h2>Status:</h2>
      <div id="results">Select 2+ features and click merge...</div>
    </div>
    <script src="topology-data.js" type="text/javascript"></script>
    <script src="merge.js" type="text/javascript"></script>
    <script src="show-source.js" data-source="merge.js" type="text/javascript"></script>
  </body>
</html>
