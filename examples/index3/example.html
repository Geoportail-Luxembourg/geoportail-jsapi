<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Cookbook Example</title>
  <script src="../../apiv4loader.js" type="text/javascript"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px;
    }
    .header {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .header a {
      text-decoration: none;
      color: #0b4ea2;
      font-weight: bold;
    }
    .header h1 {
      margin: 8px 0 6px;
      font-size: 22px;
    }
    .header p {
      margin: 0;
      color: #4b5563;
    }
    #extra {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      min-height: 20px;
    }
    #map {
      width: 100%;
      height: 520px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #dbeafe;
    }
    .panel {
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      min-height: 20px;
    }
    .profile { height: 200px; overflow: auto; }
    .layermanager, .bgselector { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <a href="../index.html">← Back to examples home</a>
      <h1 id="title">Loading…</h1>
      <p id="description"></p>
    </div>
    <div id="extra"></div>
    <div id="map"></div>
    <div id="info" class="panel"></div>
  </div>

  <script src="examples.js" type="text/javascript"></script>
</body>
</html>
